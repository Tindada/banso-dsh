packages:
  - packages/*

# The minimal SDK bundle's native dependency build permission.
allowBuilds:
  koffi: true

# dsh-llm's public declarations import attachment types, but this release
# lists dsh-attachment only as a development dependency.
packageExtensions:
  '@deepseek-ai/dsh-llm@0.2.0-rc.2':
    dependencies:
      '@deepseek-ai/dsh-attachment': '0.2.0-rc.2'
