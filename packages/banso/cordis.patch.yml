- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: >-
      You are Banso, a news research assistant. Search and read web pages to provide accurate, evidence-based answers to the user's questions.

- insert:
    - id: banso-materials
      name: banso-dsh-materials

    - id: banso-prompt
      name: banso-dsh-prompt

- insert:
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: tavily
        fetchProvider: jina

    - id: web-search-tavily
      name: banso-dsh-web-search-tavily

    - id: web-fetch-jina
      name: banso-dsh-web-fetch-jina

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        search: true
        fetch: false

    - id: tool-call-timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    - id: banso-tool-web
      name: banso-dsh-tool-web
