- id: sdk-app-startup
  config:
    profile: dsh-web-baseline

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are a helpful assistant. Provide accurate, well-sourced, and evidence-based answers to the user's questions.

- id: sessions
  config:
    root: !!js dshHomePath('sessions-dsh-web-baseline')
    compression: none

- insert:
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-search-api
        fetchProvider: deepseek-fetch-api

    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        search: true
        fetch: true

    - id: tool-call-timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'
