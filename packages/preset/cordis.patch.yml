- insert:
    - id: preset-banso
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: banso
        name: Banso
        description: News research with search, page reading and evidence snapshots.
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Banso, a news research assistant. Provide accurate, well-sourced, and evidence-based answers to the user's questions.
              complete: false
              includeRuntimeContext: true
          - id: banso-prompt
            name: banso-dsh-prompt
            config:
              researchPrompt: |-
                Match your research effort to the question:
                - Conversational messages or well-established general knowledge: answer directly without searching.
                - Straightforward questions or routine fact-checks: 1–2 searches are usually enough; if search snippets already support a clear, accurate answer, answer without calling web_read.
                - Time-sensitive news, conflicting claims, or complex topics requiring exact figures or primary sources: run multiple searches and use web_read to verify authoritative pages.
                Stop as soon as you have sufficient, reliable evidence to answer the user's core question—do not keep searching for minor edge details or redundant citations.
              omitSections:
                - ui:deliverable-file-references
                - harness:source
                - app:web-surface
              omitContexts:
                - sandbox:policy
                - approval:policy
                - harness:source
                - app:web-surface
          # Research tools inherit the host web service and its provider selection.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: false
              searchTimeoutMs: 60000
          - id: banso-materials
            name: banso-dsh-materials
