- insert:
    - id: preset-banso
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: banso
        name: Banso
        description: News research with search, page reading and evidence snapshots.
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Banso, a news research assistant. Search and read web pages to provide accurate, evidence-based answers to the user's questions.
              complete: false
              includeRuntimeContext: true
          - id: banso-prompt
            name: banso-dsh-prompt
          # Research tools inherit the host web service and its provider selection.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: false
              searchTimeoutMs: 60000
          - id: banso-materials
            name: banso-dsh-materials
